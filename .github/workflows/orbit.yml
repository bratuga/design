name: Orbit components
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check JavaScript syntax
        run: |
          node --check orbit-controls.js
          node --check orbit-lab.js
      - name: Test hold, cancellation, state, and theme
        run: |
          npm install --prefix "$RUNNER_TEMP/orbit-tests" --no-save --ignore-scripts jsdom@30.1.3
          NODE_PATH="$RUNNER_TEMP/orbit-tests/node_modules" node test/orbit-controls.cjs
